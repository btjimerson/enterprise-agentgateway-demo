# ExternalSecret: ESO materializes this as a regular K8s Secret named
# "openai-secret" in agentgateway-system. AgentgatewayBackend references
# that K8s Secret via secretRef.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openai-secret
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: openai-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # agentgateway AI providers read the API key from the "Authorization"
        # field by default. The key: references the fake store's "openai/api-key".
        Authorization: "Bearer {{ .apikey }}"
  data:
    - secretKey: apikey
      remoteRef:
        key: openai/api-key
