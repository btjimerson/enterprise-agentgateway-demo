# Exposes the multi-provider LLM backend at /chat on the agentgateway-proxy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /chat
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: multi-provider
