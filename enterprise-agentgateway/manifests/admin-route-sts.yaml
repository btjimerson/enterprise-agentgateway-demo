# HTTPRoute for admin-proxy:7777 → svc/enterprise-agentgateway:7777.
# The enterprise-agentgateway control plane Service exposes the STS on the
# tokenExchange port (7777) when `tokenExchange.enabled=true` in Helm
# values (set by 09-install-obo.sh via `helm upgrade --reuse-values`).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-route-sts
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: admin-proxy
      namespace: agentgateway-system
      sectionName: sts
      port: 7777
  rules:
    - backendRefs:
        - kind: Service
          name: enterprise-agentgateway
          port: 7777
