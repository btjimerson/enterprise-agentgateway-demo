# HTTPRoute for admin-proxy:4000 → solo-enterprise-ui.agentgateway-system.svc:80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-route-ui
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: admin-proxy
      namespace: agentgateway-system
      sectionName: ui
      port: 4000
  rules:
    - backendRefs:
        - kind: Service
          name: solo-enterprise-ui
          port: 80
