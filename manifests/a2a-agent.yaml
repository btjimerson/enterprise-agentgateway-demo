# Solo's sample Agent-to-Agent (A2A) echo agent. Used for the A2A protocol
# demo case.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-agent
  namespace: agentgateway-demo
  labels: {app: a2a-agent}
spec:
  replicas: 1
  selector: {matchLabels: {app: a2a-agent}}
  template:
    metadata:
      labels: {app: a2a-agent}
    spec:
      containers:
        - name: a2a-agent
          image: gcr.io/solo-public/docs/test-a2a-agent:latest
          ports: [{containerPort: 9090}]
---
apiVersion: v1
kind: Service
metadata:
  name: a2a-agent
  namespace: agentgateway-demo
spec:
  selector: {app: a2a-agent}
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      appProtocol: kgateway.dev/a2a
