# The actor identity for the OBO (RFC 8693) demo.
#
# `kubectl create token agent-sa -n agentgateway-demo --duration=1h` mints a
# SA token whose `sub` claim is:
#   system:serviceaccount:agentgateway-demo:agent-sa
# That exact string is what the `may_act` protocol mapper on the Keycloak
# `agw-client` pins into every user token (an oidc-hardcoded-claim-mapper in
# keycloak/realm-agentgateway-demo.json), so the agentgateway STS will accept
# this SA token as a valid actor when exchanging on bob's behalf.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sa
  namespace: agentgateway-demo
