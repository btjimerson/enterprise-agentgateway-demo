# Additional demo-only HTTPRoute at /chat-split that splits traffic 80/20
# between the OpenAI primary backend and the mock-llm fallback backend.
# Lives on a distinct path prefix so it doesn't collide with the baseline
# `chat` HTTPRoute (which routes to the multi-provider failover backend).
#
# No URLRewrite is needed: AgentgatewayBackend resources are AI-aware —
# they construct the upstream LLM call from the request body's `model`
# field and the backend's own provider config (host/path), so the
# inbound path prefix is informational only. The baseline `chat` route
# uses the same no-rewrite pattern.
#
# Backend names must match the live AgentgatewayBackend resources
# created by the install scripts: `openai-primary` and `mock-failover`
# (not `openai`/`mock`). The route status condition `BackendNotFound`
# is the canary for that mismatch.
#
# Used by demo/routing-05-weighted-split.sh.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat-split
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /chat-split
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: openai-primary
          weight: 80
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: mock-failover
          weight: 20
