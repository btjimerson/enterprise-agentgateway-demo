# A tiny HTTP server that mimics the OpenAI /v1/chat/completions response
# shape. Used as the failover target when the primary (OpenAI) group is
# unreachable — lets the demo show "multi-provider failover" without requiring
# a second paid API key.
#
# Two Deployments run from this one ConfigMap:
#
#   mock-llm         healthy provider  — 200 on /v1/chat/completions
#   mock-llm-broken  FAIL_ALL=1        — 500 on every path
#
# The broken one exists so the failover demo's primary can fail the way a real
# provider fails: sitting at its NORMAL endpoint and returning 5xx because that
# provider is unhealthy. Pointing the primary at a dedicated /v1/error path
# instead works, but the demo shows these manifests to the audience and
# `path: /v1/error` visibly telegraphs the rig.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-llm-app
  namespace: agentgateway-demo
data:
  server.py: |
    import json, os, time, uuid
    from http.server import BaseHTTPRequestHandler, HTTPServer

    # When FAIL_ALL is set this instance is an unhealthy provider: every request
    # gets a real HTTP 500, whatever the path. Used by mock-llm-broken.
    FAIL_ALL = os.environ.get("FAIL_ALL", "").lower() in ("1", "true", "yes")

    class H(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args): return
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(length) if length else b"{}"
            try:
                payload = json.loads(body)
            except Exception:
                payload = {}
            # A genuine upstream 500 is what the failover demo needs: a refused
            # connection or DNS failure is synthesized by the proxy and bypasses
            # unhealthyCondition evaluation, so eviction would never fire.
            #
            # The requested model is echoed back so the failover demo prints the
            # provider that actually broke (gpt-4o) rather than an error type.
            # Reading `model` from the response then tells a coherent story:
            # req 1 gpt-4o (500) -> reqs 2+ mock-llm-1 (200).
            #
            # /v1/error is kept for ad-hoc probing of a single instance; the
            # failover demo itself now uses the FAIL_ALL deployment.
            if FAIL_ALL or self.path.startswith("/v1/error"):
                err = json.dumps({
                    "model": payload.get("model", "unknown"),
                    "error": {
                        "message": "[mock-llm] forced 500 for failover demo",
                        "type": "server_error",
                    }
                }).encode()
                self.send_response(500)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(err)))
                self.end_headers()
                self.wfile.write(err)
                return
            user_msg = ""
            for m in payload.get("messages", []):
                if m.get("role") == "user":
                    user_msg = m.get("content", "")
            resp = {
                "id": f"chatcmpl-mock-{uuid.uuid4().hex[:8]}",
                "object": "chat.completion",
                "created": int(time.time()),
                "model": "mock-llm-1",
                "choices": [{
                    "index": 0,
                    "message": {
                        "role": "assistant",
                        "content": f"[mock-llm] I received: {user_msg[:120]}",
                    },
                    "finish_reason": "stop",
                }],
                "usage": {"prompt_tokens": 10, "completion_tokens": 20, "total_tokens": 30},
            }
            data = json.dumps(resp).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8000), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: agentgateway-demo
spec:
  replicas: 1
  selector: {matchLabels: {app: mock-llm}}
  template:
    metadata:
      labels: {app: mock-llm}
    spec:
      containers:
        - name: mock-llm
          image: python:3.12-slim
          command: ["python3", "/app/server.py"]
          ports: [{containerPort: 8000}]
          volumeMounts:
            - {name: app, mountPath: /app}
      volumes:
        - name: app
          configMap:
            name: mock-llm-app
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: agentgateway-demo
spec:
  selector: {app: mock-llm}
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
# Unhealthy provider used as the failover demo's primary (group 0). Same code as
# mock-llm, but FAIL_ALL=1 makes it return a real HTTP 500 on the normal
# /v1/chat/completions path — so the backend spec for group 0 looks exactly like
# a healthy provider's and only the host differs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm-broken
  namespace: agentgateway-demo
spec:
  replicas: 1
  selector: {matchLabels: {app: mock-llm-broken}}
  template:
    metadata:
      labels: {app: mock-llm-broken}
    spec:
      containers:
        - name: mock-llm
          image: python:3.12-slim
          command: ["python3", "/app/server.py"]
          env:
            - {name: FAIL_ALL, value: "1"}
          ports: [{containerPort: 8000}]
          volumeMounts:
            - {name: app, mountPath: /app}
      volumes:
        - name: app
          configMap:
            name: mock-llm-app
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm-broken
  namespace: agentgateway-demo
spec:
  selector: {app: mock-llm-broken}
  ports:
    - name: http
      port: 80
      targetPort: 8000
