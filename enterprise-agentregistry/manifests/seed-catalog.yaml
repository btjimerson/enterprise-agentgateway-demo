# Synthetic Agent Registry catalog — a believable set of agents + MCP servers so
# the registry UI and `arctl` demos have realistic data to browse. Registered
# with `./seed-registry-data.sh` (arctl apply -f), removed with `--cleanup`
# (arctl delete -f). Nothing is built or pulled: the registry catalogs the
# declarative spec, and localhost:5001/* image refs are exempt from OCI-label
# validation, so no images/registries are required. All names are `demo-`
# prefixed for clean teardown.
#
# ── Agents ────────────────────────────────────────────────────────────────
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata: {name: demo-billing-copilot, labels: {arctl.dev/framework: adk, arctl.dev/language: python}}
spec: {description: "Answers customer billing questions and drafts refunds for review.", modelName: gpt-4o, modelProvider: openai, source: {image: localhost:5001/demo-billing-copilot:latest}}
---
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata: {name: demo-fraud-triage, labels: {arctl.dev/framework: langgraph, arctl.dev/language: python}}
spec: {description: "Triages suspicious transactions and escalates high-risk cases.", modelName: claude-sonnet-4-5, modelProvider: anthropic, source: {image: localhost:5001/demo-fraud-triage:latest}}
---
apiVersion: ar.dev/v1alpha1
