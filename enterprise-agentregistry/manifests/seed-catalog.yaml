# ── MCP servers ─────────────────────────────────────────────────────────────
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata: {name: demo-crm, labels: {arctl.dev/framework: fastmcp, arctl.dev/language: python}}
spec:
  description: "CRM account lookup and update tools."
  title: CRM
  source:
    package:
      command: python3
      launch: {args: [{type: positional, value: src/main.py}]}
      origin: {identifier: localhost:5001/demo-crm:latest, type: oci, oci: {serverName: demo-crm}}
      transport: {type: http, path: /mcp, port: 3000}
---
